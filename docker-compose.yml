services:
  # Nuestro laboratorio de procesamiento de datos
  data-science:
    build:
      context: ./data
      dockerfile: Dockerfile
    image: graphito-data
    volumes:
      - ./data:/app
    env_file:
      - .env
    stdin_open: true # Para que puedas interactuar con la terminal
    tty: true # Para ver colores y formato en la terminal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: graphito-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Evitar reescribir node_modules en la máquina local si hay diferencias en C++ add-ons
      - /app/node_modules
    environment:
      - NODE_ENV=development
  postgres:
    image: postgres:16-alpine
    container_name: graphito-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=graphito
      - POSTGRES_PASSWORD=graphitosecret
      - POSTGRES_DB=graphito_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  chroma:
    image: chromadb/chroma:latest
    container_name: graphito-chroma
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: graphito-backend
    container_name: graphito-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Deploy artifacts (models/deploy/: manifest, calibrations, CharCNN v2) are read from here.
      - ./models:/models:ro
      # Hugging Face cache for microsoft/graphcodebert-base (GraphCodeBERT v2 secondary signal).
      - hf_cache:/hf_cache
    env_file:
      - .env
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - USE_CHROMA_SERVER=true
      - HF_HOME=/hf_cache
      # Model integration (backend/app/config.py). Decision thresholds come only from the
      # calibration files in models/deploy/; there are no threshold settings to tune here.
      # ALLOW_UNCALIBRATED is a development-only switch: this profile always forces it off.
      - ALLOW_UNCALIBRATED=false
      # false disables the exploratory GraphCodeBERT signal (gcb_similarity is then always null);
      # true (default) keeps REAL not ready until GraphCodeBERT loads.
      - GCB_SECONDARY_ENABLED=${GCB_SECONDARY_ENABLED:-true}
      - INFERENCE_WORKERS=${INFERENCE_WORKERS:-1}
    depends_on:
      - chroma

volumes:
  postgres_data:
  chroma_data:
  hf_cache:
