version: '3.8'

services:
  # Nuestro laboratorio de procesamiento de datos
  data-science:
    build:
      context: ./data
      dockerfile: Dockerfile
    image: graphito-data
    volumes:
      - ./data:/app
    env_file:
      - .env
    stdin_open: true # Para que puedas interactuar con la terminal
    tty: true # Para ver colores y formato en la terminal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: graphito-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Evitar reescribir node_modules en la máquina local si hay diferencias en C++ add-ons
      - /app/node_modules
    environment:
      - NODE_ENV=development
  postgres:
    image: postgres:16-alpine
    container_name: graphito-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=graphito
      - POSTGRES_PASSWORD=graphitosecret
      - POSTGRES_DB=graphito_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  chroma:
    image: chromadb/chroma:latest
    container_name: graphito-chroma
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: graphito-backend
    container_name: graphito-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./models:/models:ro
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://graphito:graphitosecret@postgres:5432/graphito_db
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - USE_CHROMA_SERVER=true
    depends_on:
      - postgres
      - chroma

volumes:
  postgres_data:
  chroma_data:
